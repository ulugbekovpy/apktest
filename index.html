<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Topqirvoy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one portrait play field (9:16) centred on the page. Inside: room scene, owl, HUD on top, five room buttons at the bottom,
   context buttons down the right edge, overlays for shop / arcade / games. Single committed look (warm Tashkent home), no dark variant. */
:root {
  --ink: #14204a; --muted: #5d6590; --paper: #fff8ec; --card: #ffffff;
  --blue: #0b3fb8; --blue-d: #0a2f8a; --orange: #f07a12; --gold: #f5b72c;
  --good: #35a853; --warn: #f2a21a; --bad: #e0463b; --line: rgba(20, 32, 74, 0.18);
  --page: #0e1430; --sky1: #7ecbf0; --sky2: #d9f1fb;
  --font-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
}
html { min-height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font-body);
  min-height: 100vh; box-sizing: border-box;
  display: flex; justify-content: center; align-items: center;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .owl:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.emo { font-family: var(--font-emoji); font-style: normal; line-height: 1; }

.stage {
  position: relative; overflow: hidden; container-type: size;
  width: min(100%, max(260px, calc((100vh - 24px) * 0.5625)));
  aspect-ratio: 9 / 16; border-radius: 20px; background: #f1e0c3;
  user-select: none; -webkit-user-select: none; font-size: 3.6cqw;
}
.stage > * { position: absolute; }
.scene, .fore { inset: 0; width: 100%; height: 100%; display: block; }
.scene { z-index: 1; }
.fore { z-index: 2; pointer-events: none; }
.rm { display: none; }
.stage[data-room="living"] .rm-living, .stage[data-room="bed"] .rm-bed, .stage[data-room="bath"] .rm-bath { display: inline; }
#blanket, #tubfront { display: none; }
.stage.lying #blanket { display: inline; }
.stage[data-room="bath"] #tubfront { display: inline; }
.sun, .clouds, .moon, .stars { transition: opacity .6s; }
.moon, .stars { opacity: 0; }
.tod-night .sun, .tod-night .clouds { opacity: 0; }
.tod-night .moon, .tod-night .stars { opacity: 1; }
.tod-dusk .sun { fill: #ffd08a; }
.lampglow { opacity: .35; transition: opacity .6s; }
.tod-night .lampglow { opacity: .9; }
.bedglow { opacity: .85; transition: opacity .5s; }
.stage.dark .bedglow { opacity: 0; }

/* owl */
.owl {
  z-index: 2; width: 80cqw; aspect-ratio: 440 / 480; bottom: 26cqw; left: 50%;
  transform: translateX(-50%); transform-origin: 50% 50%;
  transition: left 2.4s linear, bottom .7s ease, transform .8s ease; cursor: pointer; touch-action: manipulation;
}
.owl.fast { transition: left .8s ease, bottom .7s ease, transform .8s ease; }
.owl.washing { touch-action: none; cursor: grab; }
.owl.lying { transform: translateX(-50%) rotate(-90deg) scale(.62); }
.owl-in { position: absolute; inset: 0; transform-origin: 50% 96%; animation: breathe 3.2s ease-in-out infinite; }
.frames img, .dirt, .lids { position: absolute; inset: 0; width: 100%; height: 100%; }
.frames img { opacity: 0; pointer-events: none; -webkit-user-drag: none; filter: sepia(calc(var(--dirt, 0) * .5)) brightness(calc(1 - var(--dirt, 0) * .1)); }
.frames img.on { opacity: 1; }
.dirt {
  opacity: var(--dirt, 0); mix-blend-mode: multiply; pointer-events: none; -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  background-image:
    radial-gradient(circle at 36% 72%, rgba(96,66,34,.9) 0 5%, transparent 6.5%), radial-gradient(circle at 58% 64%, rgba(96,66,34,.8) 0 4%, transparent 5.5%),
    radial-gradient(circle at 70% 84%, rgba(96,66,34,.85) 0 6%, transparent 7.5%), radial-gradient(circle at 44% 90%, rgba(96,66,34,.8) 0 4.5%, transparent 6%),
    radial-gradient(circle at 30% 30%, rgba(96,66,34,.75) 0 4%, transparent 5.5%), radial-gradient(circle at 66% 38%, rgba(96,66,34,.8) 0 3.5%, transparent 5%),
    radial-gradient(circle at 50% 52%, rgba(96,66,34,.7) 0 5%, transparent 6.5%);
}
.lids { opacity: 0; pointer-events: none; transition: opacity .05s; }
.lids.on { opacity: 1; }
.owl-in.walk { animation: walkbob .42s ease-in-out infinite; }
.owl-in.hop { animation: hop .6s ease-out; }
.owl-in.squish { animation: squish .38s ease-out; }
.owl-in.bonk { animation: bonk .45s ease-out; }
.owl-in.chew { animation: chew .3s ease-in-out 4; }
.owl-in.wobble { animation: wobble .5s ease-in-out infinite; }
.owl-in.sleepy { animation: sleepy 4s ease-in-out infinite; }
.owl-in.talk { animation: talk .26s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.02); } }
@keyframes walkbob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-2.2cqw) rotate(1.2deg); } }
@keyframes hop { 0% { transform: scale(1.06, .92); } 35% { transform: translateY(-7cqw) scale(.97, 1.04); } 70% { transform: translateY(0) scale(1.05, .94); } 100% { transform: none; } }
@keyframes squish { 0% { transform: scale(1); } 30% { transform: scale(1.09, .9); } 65% { transform: scale(.96, 1.05); } 100% { transform: scale(1); } }
@keyframes bonk { 0% { transform: none; } 18% { transform: translate(2cqw, 3cqw) scale(1.12, .8) rotate(4deg); } 45% { transform: translate(-1.4cqw, 0) scale(.95, 1.06) rotate(-3deg); } 100% { transform: none; } }
@keyframes chew { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03, .97) translateY(.6cqw); } }
@keyframes wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes sleepy { 0%,100% { transform: rotate(-1deg) scale(1, 1); } 50% { transform: rotate(1.6deg) scale(1.01, 1.03); } }
@keyframes talk { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.012, .985) translateY(.3cqw); } }

.night { inset: 0; z-index: 3; background: rgba(8, 12, 46, .66); opacity: 0; pointer-events: none; transition: opacity .8s; }
.night.on { opacity: 1; }
.fx { inset: 0; z-index: 4; pointer-events: none; }
.fx .item { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
.heart { width: 6cqw; height: 6cqw; color: #ef476f; animation: rise 1.3s ease-out forwards; }
.bub { width: 5cqw; height: 5cqw; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, rgba(190,225,255,.55) 60%, rgba(120,180,240,.35)); border: 1px solid rgba(90,150,230,.6); animation: rise 1.2s ease-out forwards; }
.crumb { width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: #d9a050; animation: crumb .7s ease-out forwards; }
.zzz { font: 600 5cqw/1 var(--font-display); color: #cfd8ff; animation: rise 2.4s ease-out forwards; }
.ftext { font: 600 5.4cqw/1 var(--font-display); color: var(--blue); text-shadow: 0 1px 0 #fff, 0 0 6px #fff; animation: rise 1s ease-out forwards; }
.star { font: 700 6cqw/1 var(--font-display); color: var(--gold); text-shadow: 0 .4cqw 0 #b9801a; animation: spin 0.8s ease-out forwards; }
@keyframes rise { from { opacity: 0; margin-top: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } to { opacity: 0; margin-top: -16cqw; transform: translate(-50%, -50%) scale(1); } }
@keyframes crumb { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(calc(-50% + var(--dx, 0cqw)), calc(-50% + 8cqw)); } }
@keyframes spin { from { opacity: 1; transform: translate(-50%, -50%) rotate(0) scale(.6); } to { opacity: 0; transform: translate(calc(-50% + var(--dx, 0cqw)), calc(-50% - 9cqw)) rotate(280deg) scale(1.1); } }
.fly { position: absolute; left: 0; top: 0; width: 13cqw; height: 13cqw; display: grid; place-items: center; font-size: 11cqw; }
.fly svg { width: 100%; height: 100%; display: block; }

.say {
  z-index: 5; left: 50%; top: 35cqw; transform: translateX(-50%); max-width: 68cqw; width: max-content;
  background: #fff; color: var(--ink); border: .6cqw solid var(--ink); border-radius: 4cqw; padding: 2cqw 3.4cqw; text-align: center; pointer-events: none; animation: pop .25s ease-out;
}
.say b { display: block; font: 500 4cqw/1.25 var(--font-display); }
.say small { display: block; font: 400 3cqw/1.3 var(--font-body); color: var(--muted); margin-top: .6cqw; }
.say::after { content: ""; position: absolute; left: 50%; bottom: -2.4cqw; width: 3.6cqw; height: 3.6cqw; background: #fff; border-right: .6cqw solid var(--ink); border-bottom: .6cqw solid var(--ink); transform: translateX(-50%) rotate(45deg); }
@keyframes pop { from { opacity: 0; transform: translateX(-50%) scale(.85); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

/* HUD */
.hud { z-index: 6; left: 0; right: 0; top: 0; padding: 3cqw 3.2cqw 0; display: grid; gap: 2.4cqw; pointer-events: none; }
.hud > * { pointer-events: auto; }
.row1 { display: flex; align-items: center; gap: 2cqw; }
.pill { display: flex; align-items: center; gap: 1.6cqw; background: var(--paper); border: .5cqw solid var(--ink); border-radius: 99cqw; padding: 1.2cqw 3cqw 1.2cqw 1.6cqw; font: 600 4.2cqw/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pill svg { width: 5.4cqw; height: 5.4cqw; }
.lvl { position: relative; overflow: hidden; padding-left: 3cqw; }
.lvl .xp { position: absolute; left: 0; bottom: 0; height: 1cqw; background: var(--orange); width: 0; transition: width .4s; }
.modebtn { padding-left: 3cqw; font-size: 3.6cqw; }
.modebtn[aria-pressed="true"] { background: var(--orange); color: #fff; }
.sp { flex: 1; }
.iconbtn { width: 9cqw; height: 9cqw; border-radius: 50%; background: var(--paper); border: .5cqw solid var(--ink); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn svg { width: 5cqw; height: 5cqw; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.4cqw; background: rgba(255, 248, 236, .93); border: .5cqw solid var(--ink); border-radius: 4cqw; padding: 2cqw 2.6cqw; }
.stat { display: flex; align-items: center; gap: 1.4cqw; min-width: 0; }
.stat svg { width: 4.6cqw; height: 4.6cqw; flex: none; color: var(--blue); }
.stat.low svg { color: var(--bad); animation: pulse .9s ease-in-out infinite; }
.track { flex: 1; min-width: 0; height: 2cqw; border-radius: 9cqw; background: rgba(20, 32, 74, .14); overflow: hidden; }
.fill { height: 100%; width: 50%; border-radius: inherit; background: var(--good); transition: width .5s, background-color .3s; }
.stat.mid .fill { background: var(--warn); }
.stat.low .fill { background: var(--bad); }
@keyframes pulse { 50% { transform: scale(1.25); } }

/* right-edge context buttons and bottom room bar */
.side { z-index: 6; right: 2.6cqw; top: 31cqw; display: grid; gap: 3cqw; justify-items: center; }
.rb { position: relative; display: grid; justify-items: center; gap: .8cqw; }
.ring { width: 14cqw; height: 14cqw; border-radius: 50%; background: var(--paper); border: .7cqw solid var(--ink); box-shadow: 0 1.1cqw 0 rgba(20,32,74,.28); display: grid; place-items: center; color: var(--blue); transition: transform .12s; }
.ring svg { width: 7cqw; height: 7cqw; }
.rb:active .ring { transform: translateY(.8cqw); box-shadow: 0 .4cqw 0 rgba(20,32,74,.28); }
.rb[aria-pressed="true"] .ring, .rb.here .ring { background: var(--blue); color: #fff; }
.lbl { font: 600 3cqw/1 var(--font-display); color: var(--ink); background: rgba(255,248,236,.94); border-radius: 9cqw; padding: .8cqw 2cqw; white-space: nowrap; }
.side .ring { width: 12.4cqw; height: 12.4cqw; }
.side .ring svg { width: 6.2cqw; height: 6.2cqw; }
.bar { z-index: 6; left: 0; right: 0; bottom: 0; padding: 0 2.6cqw 2.4cqw; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1cqw; align-items: start; }
.dot { position: absolute; top: -.4cqw; right: 12%; width: 4cqw; height: 4cqw; border-radius: 50%; background: var(--bad); border: .5cqw solid #fff; display: none; animation: pulse .9s ease-in-out infinite; }
.rb.alert .dot { display: block; }
.hint { z-index: 6; left: 50%; bottom: 25cqw; transform: translateX(-50%); width: max-content; max-width: 84cqw; background: var(--ink); color: #fff; border-radius: 9cqw; padding: 2cqw 4cqw; font: 500 3.6cqw/1.2 var(--font-display); text-align: center; }
.hint .mini { display: block; height: 1.6cqw; margin-top: 1.4cqw; border-radius: 9cqw; background: rgba(255,255,255,.25); overflow: hidden; }
.hint .mini i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .15s; }
.sorry { z-index: 6; left: 50%; bottom: 25cqw; transform: translateX(-50%); background: var(--orange); color: #fff; border-radius: 9cqw; padding: 2.6cqw 6cqw; font: 600 4.4cqw/1 var(--font-display); box-shadow: 0 1cqw 0 #b3550a; }
.lamp-hit { z-index: 6; left: 79%; top: 61%; width: 19%; height: 13%; border-radius: 6cqw; background: transparent; }
.lamp-hit::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: .6cqw dashed rgba(255, 240, 180, .0); transition: border-color .3s; }
.stage[data-room="bed"] .lamp-hit:hover::after { border-color: rgba(255, 240, 180, .8); }
.stage:not([data-room="bed"]) .lamp-hit { display: none; }
.brush { z-index: 5; left: 0; top: 0; width: 26cqw; height: 9cqw; pointer-events: none; transform: translate(-50%, -50%) rotate(-18deg); }
.brush svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 .8cqw .6cqw rgba(0,0,0,.25)); }

/* sheets and overlays */
.sheet { z-index: 8; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: .7cqw solid var(--ink); border-radius: 6cqw 6cqw 0 0; padding: 3.4cqw 3.4cqw 4cqw; animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.6cqw; gap: 2cqw; }
.sheet-h h2 { margin: 0; font: 600 5cqw/1.1 var(--font-display); }
.foods { display: flex; gap: 2.6cqw; overflow-x: auto; padding: 1cqw .6cqw 2cqw; scroll-snap-type: x proximity; }
.food { position: relative; flex: none; width: 27cqw; scroll-snap-align: start; background: #fff; border: .5cqw solid var(--line); border-radius: 4cqw; padding: 2.2cqw 2cqw 2.4cqw; display: grid; justify-items: center; gap: 1cqw; text-align: center; box-shadow: 0 .8cqw 0 rgba(20,32,74,.12); }
.food:active { transform: translateY(.6cqw); box-shadow: none; }
.food .pic { width: 14cqw; height: 14cqw; display: grid; place-items: center; font-size: 11.5cqw; }
.food .pic svg { width: 100%; height: 100%; }
.food b { font: 600 3.9cqw/1.1 var(--font-display); }
.food em { font-style: normal; font-size: 2.7cqw; color: var(--blue); margin-top: -.6cqw; }
.food small { font-size: 2.8cqw; color: var(--muted); line-height: 1.25; min-height: 7cqw; }
.price { display: inline-flex; align-items: center; gap: 1cqw; font: 600 3.6cqw/1 var(--font-display); color: var(--blue-d); }
.price svg { width: 4.2cqw; height: 4.2cqw; }
.food.poor { opacity: .5; }
.cnt { position: absolute; top: -1.2cqw; right: -1cqw; min-width: 6cqw; height: 6cqw; border-radius: 9cqw; background: var(--orange); color: #fff; font: 600 3.4cqw/6cqw var(--font-display); text-align: center; padding: 0 1.2cqw; border: .5cqw solid #fff; }
.empty { padding: 4cqw 2cqw 2cqw; text-align: center; color: var(--muted); font-size: 3.8cqw; line-height: 1.4; display: grid; gap: 3cqw; justify-items: center; }

.ov { z-index: 9; inset: 0; display: flex; flex-direction: column; padding: 3.4cqw; gap: 2.6cqw; }
.ov-h { display: flex; align-items: center; gap: 2cqw; }
.ov-h h2 { margin: 0; font: 600 5cqw/1.1 var(--font-display); flex: 1; min-width: 0; }
.shop { background: #fbefd6; background-image: linear-gradient(rgba(20,32,74,.05) 1px, transparent 1px); background-size: 100% 6cqw; }
.awning { height: 13cqw; margin: -3.4cqw -3.4cqw 0; background: repeating-linear-gradient(90deg, #e0463b 0 9cqw, #fff8ec 9cqw 18cqw); border-bottom: .7cqw solid var(--ink); position: relative; flex: none; }
.awning::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3.4cqw; height: 3.4cqw; background: radial-gradient(circle at 4.5cqw 0, #e0463b 0 4.4cqw, transparent 4.6cqw) 0 0 / 18cqw 100% repeat-x, radial-gradient(circle at 13.5cqw 0, #fff8ec 0 4.4cqw, transparent 4.6cqw) 0 0 / 18cqw 100% repeat-x; }
.awning b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper); border: .5cqw solid var(--ink); border-radius: 9cqw; padding: 1.2cqw 5cqw; font: 600 5cqw/1 var(--font-display); }
.tabs { display: flex; gap: 2cqw; margin-top: 3cqw; flex: none; }
.tab { flex: 1; background: var(--paper); border: .5cqw solid var(--ink); border-radius: 9cqw; padding: 2cqw 1cqw; font: 600 3.4cqw/1 var(--font-display); text-align: center; }
.tab[aria-pressed="true"] { background: var(--blue); color: #fff; }
.shelf { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3cqw; align-content: start; padding: 2cqw 1cqw 3cqw; }
.shelf .food { width: auto; }
.menu { background: #f3ead6; background-image: linear-gradient(rgba(20,32,74,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20,32,74,.06) 1px, transparent 1px); background-size: 9cqw 9cqw; }
.menu-b { flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 3.4cqw; align-content: start; padding-bottom: 3cqw; }
.menu-b h3 { margin: 1cqw 0 0; font: 600 3.8cqw/1 var(--font-display); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.gr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.6cqw; }
.gcard { background: #fff; border: .5cqw solid var(--ink); border-radius: 4cqw; padding: 2.6cqw 1.4cqw 2.2cqw; display: grid; justify-items: center; gap: 1.2cqw; text-align: center; box-shadow: 0 .9cqw 0 rgba(20,32,74,.18); min-width: 0; }
.gcard:active { transform: translateY(.6cqw); box-shadow: none; }
.gcard .emo { font-size: 9cqw; }
.gcard b { font: 600 3.5cqw/1.1 var(--font-display); }
.gcard small { font-size: 2.6cqw; color: var(--muted); line-height: 1.2; }
.game { background: #f3ead6; background-image: linear-gradient(rgba(20,32,74,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20,32,74,.06) 1px, transparent 1px); background-size: 9cqw 9cqw; }
.lives { display: flex; gap: .6cqw; }
.lives svg { width: 5cqw; height: 5cqw; color: #ef476f; }
.lives svg.off { color: rgba(20,32,74,.2); }
.timebar { height: 2.4cqw; border-radius: 9cqw; background: rgba(20,32,74,.14); overflow: hidden; flex: none; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--orange); transition: width .2s linear; }
.gbody { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2.6cqw; }
.panel { position: absolute; inset: 0; z-index: 2; background: rgba(243,234,214,.95); display: grid; place-content: center; justify-items: center; gap: 3cqw; text-align: center; padding: 8cqw; }
.panel h3 { margin: 0; font: 600 7cqw/1.1 var(--font-display); }
.panel p { margin: 0; font-size: 3.8cqw; line-height: 1.45; color: var(--muted); max-width: 72cqw; }
.panel .legend { display: flex; gap: 4cqw; align-items: center; color: var(--ink); font-size: 3.2cqw; }
.panel .legend span { display: inline-flex; align-items: center; gap: 1cqw; }
.panel .legend svg { width: 5cqw; height: 6.5cqw; }

  var sr = stageRect(), orr = owl.getBoundingClientRect(), size = el.offsetWidth;
  var x0 = box.left - sr.left + box.width / 2 - size / 2, y0 = box.top - sr.top + box.height / 2 - size / 2;
  var x1 = orr.left - sr.left + orr.width * 0.51 - size / 2, y1 = orr.top - sr.top + orr.height * 0.46 - size / 2;
  if (!el.animate) { el.remove(); done(); return; }
  var a = el.animate([
    { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1)' },
    { transform: 'translate(' + ((x0 + x1) / 2) + 'px,' + (Math.min(y0, y1) - 50) + 'px) scale(1.15)', offset: 0.5 },
    { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.3)' }

  a.onfinish = function () { el.remove(); done(); };
}

}

function endCtx() { if (gCtx) { var c = gCtx; gCtx = null; c.done = true; c.cl.forEach(function (f) { try { f(); } catch (e) {} }); c.cl = []; } }
onClose(endCtx);

function openGame(id) {
  var g = GAMES[id]; if (!g) return;
  if (S.energy < (g.need != null ? g.need : 8)) { toast('Boyqush charchagan. Avval uxlatib oling.'); return; }
  closeAll(); mode = 'game'; gCur = g; gLevel = null;
  $('#game').hidden = false; $('#gTitle').textContent = g.t; $('#gScore').textContent = '0';
  $('#gLives').hidden = true; $('#gTimeWrap').hidden = true; $('#gBody').innerHTML = '';
  showIntro(g);
}
function showIntro(g) {
  var btns = g.levels ? g.levels.map(function (l, i) { return '<button class="big' + (i === 1 ? '' : ' alt') + '" data-lv="' + i + '">' + l[0] + '</button>'; }).join('') : '<button class="big" id="gGo">Boshlash</button>';
  $('#gBody').innerHTML = ''; $('#gTimeWrap').hidden = true; $('#gLives').hidden = true; $('#gScore').textContent = '0';
  panel('<h3>' + g.t + '</h3><p>' + g.d + '</p>' + (g.legend || '') + '<div class="row" style="flex-direction:column;align-items:center">' + btns + '</div>');
}
function panel(html) { var p = $('#gPanel'); p.innerHTML = html; p.hidden = false; }
function makeCtx(g) {
  var c = { g: g, body: $('#gBody'), cl: [], done: false };
  c.score = function (n) { $('#gScore').textContent = n; };
  c.time = function (f) { $('#gTimeWrap').hidden = false; $('#gTime').style.width = Math.max(0, Math.min(1, f)) * 100 + '%'; };
  c.lives = function (n, max) {
    var h = ''; for (var i = 0; i < max; i++) h += '<svg viewBox="0 0 24 24" class="' + (i < n ? '' : 'off') + '"><use href="#i-heart"/></svg>';
    var el = $('#gLives'); el.innerHTML = h; el.hidden = false;
  };
  c.t = function (fn, ms) { var id = setTimeout(function () { if (!c.done) fn(); }, ms); c.cl.push(function () { clearTimeout(id); }); return id; };
  c.iv = function (fn, ms) { var id = setInterval(function () { if (!c.done) fn(); }, ms); c.cl.push(function () { clearInterval(id); }); return id; };
  c.add = function (fn) { c.cl.push(fn); };
  c.countdown = function (total, onEnd) {
    var left = total; c.time(1);
    c.iv(function () { left -= 0.2; c.time(left / total); if (left <= 0) onEnd(); }, 200);
    return { add: function (s) { left += s; }, get left() { return left; } };
  };
  c.finish = function (res) {
    if (c.done) return; endCtx(); c.done = true; res = res || {};
    var coins = res.coins || 0, cost = g.cost != null ? g.cost : 6;
    var fun = res.fun != null ? res.fun : Math.min(32, 4 + coins * 2);
    S.coins += coins; gain({ fun: fun, energy: -cost }); addXp(res.xp != null ? res.xp : Math.max(2, coins));
    var rec = false; if (res.score != null && res.score > (S.hi[g.id] || 0)) { S.hi[g.id] = res.score; rec = res.score > 0; }
    render(); save(); sfx(snd.ok, 'triangle');
    $('#gLives').hidden = true;
    var lvBtn = g.levels ? '<button class="big" id="gAgain">Yana o\'ynash</button>' : '<button class="big" id="gAgain">Yana o\'ynash</button>';
    panel('<h3>' + (res.title || 'Tugadi') + '</h3><div class="score">' + (coins ? '+' + coins + ' tanga' : 'Yaxshi urinish') + '</div><p>' + (res.msg || '') + (rec ? ' Yangi rekord: ' + res.score + '!' : '') + '</p>' + lvBtn + '<button class="ghost" id="gMenu">O\'yinlar ro\'yxati</button><button class="ghost" id="gOut">Xonaga qaytish</button>');
  };
  return c;
}
function startGame(g, lv) {

  $('#gLives').hidden = true; $('#gTimeWrap').hidden = true;
